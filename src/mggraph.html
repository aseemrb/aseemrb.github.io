<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Genealogy Graph Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8fafc;
            color: #1e293b;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            z-index: 20;
        }

        h1 { 
            margin: 0; 
            font-size: 1.25rem; 
            font-weight: 600; 
            color: #0f172a; 
            letter-spacing: -0.025em;
        }

        .controls {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background-color: #3b82f6;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            border: none;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .btn:hover { 
            background-color: #2563eb; 
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .btn:active {
            transform: translateY(0);
        }

        .btn-outline { 
            background-color: white; 
            border: 1px solid #e2e8f0; 
            color: #475569; 
        }
        
        .btn-outline:hover { 
            background-color: #f8fafc; 
            border-color: #cbd5e1;
            color: #1e293b;
        }

        .zoom-controls {
            display: flex;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            overflow: hidden;
            margin-left: 1rem;
        }

        .zoom-btn {
            background: white;
            border: none;
            border-right: 1px solid #e2e8f0;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            color: #64748b;
            transition: background 0.1s;
        }
        
        .zoom-btn:last-child { border-right: none; }
        .zoom-btn:hover { background: #f1f5f9; color: #0f172a; }

        #graph-container {
            flex-grow: 1;
            position: relative;
            background: #f8fafc;
            overflow: hidden;
            cursor: grab;
        }

        #graph-container:active {
            cursor: grabbing;
        }

        /* D3 Graph Styles */
        .node circle {
            stroke: #fff;
            stroke-width: 2px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 4px 3px rgba(0,0,0,0.07));
        }
        
        .node:hover circle {
            stroke: #3b82f6;
            stroke-width: 3px;
            filter: drop-shadow(0 10px 8px rgba(0,0,0,0.1));
            r: 12px !important; /* Slightly enlarge on hover */
        }

        .node text {
            font: 12px 'Inter', sans-serif;
            pointer-events: none;
            fill: #334155;
            font-weight: 500;
            text-shadow: 
                -2px -2px 2px #f8fafc, 
                2px -2px 2px #f8fafc, 
                -2px 2px 2px #f8fafc, 
                2px 2px 2px #f8fafc;
            opacity: 0.9;
        }

        .link {
            stroke: #cbd5e1;
            stroke-opacity: 0.6;
            stroke-width: 1.5px;
            transition: stroke-width 0.2s;
        }

        .tooltip {
            position: absolute;
            padding: 0.75rem;
            font-size: 0.875rem;
            background: rgba(15, 23, 42, 0.95);
            color: #fff;
            border-radius: 0.5rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 100;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            max-width: 250px;
            line-height: 1.4;
            backdrop-filter: blur(4px);
        }
        
        .tooltip strong {
            display: block;
            margin-bottom: 0.25rem;
            font-size: 1rem;
            color: #60a5fa;
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #94a3b8;
            text-align: center;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

<header>
    <h1>Math Genealogy Graph</h1>
    <div class="controls">
        <div class="zoom-controls">
            <button class="zoom-btn" onclick="zoomIn()" title="Zoom In">+</button>
            <button class="zoom-btn" onclick="zoomReset()" title="Reset Zoom">⟲</button>
            <button class="zoom-btn" onclick="zoomOut()" title="Zoom Out">−</button>
        </div>
        
        <div style="display: flex; align-items: center; gap: 8px; margin-left: 1rem; border-left: 1px solid #e2e8f0; padding-left: 1rem;">
            <label for="depthInput" style="font-size: 0.875rem; font-weight: 500; color: #475569;">Max Depth:</label>
            <input type="number" id="depthInput" onchange="filterAndDraw()" min="0" style="width: 60px; padding: 0.4rem; border-radius: 0.375rem; border: 1px solid #cbd5e1; background: white; color: #1e293b; font-size: 0.875rem;">
        </div>

        <label class="btn" style="margin-left: 1rem;">
            Upload JSON
            <input type="file" id="fileInput" accept=".json">
        </label>
        <button class="btn btn-outline" onclick="loadDefault()">Load Default</button>
    </div>
</header>

<div id="graph-container">
    <div class="empty-state">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path>
        </svg>
        <p>Upload mggraph.json or click "Load Default" to view the graph.</p>
    </div>
</div>

<div id="tooltip" class="tooltip"></div>

<script>
    // Global variables
    let svg, g, zoom;
    let fullNodes = [];
    let fullLinks = [];
    let maxGraphDepth = 0;

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                processData(data);
            } catch (err) {
                alert("Error drawing graph. Make sure the JSON file is valid.");
                console.error(err);
            }
        };
        reader.readAsText(file);
    });

    function loadDefault() {
        fetch('../mggraph.json')
            .then(response => response.json())
            .then(data => processData(data))
            .catch(err => {
                console.error("Failed to load default graph:", err);
                alert("Could not load ../mggraph.json. Please upload the file manually.");
            });
    }

    function processData(data) {
        // --- 1. Calculate Depths for ALL nodes ---
        const nodesMap = new Map(data.nodes.map(n => [n.id, { ...n, depth: -1 }]));
        const adjacency = new Map();
        
        data.links.forEach(l => {
            const src = l.source.id || l.source;
            const tgt = l.target.id || l.target;
            
            if (!adjacency.has(src)) adjacency.set(src, []);
            if (!adjacency.has(tgt)) adjacency.set(tgt, []);
            
            adjacency.get(src).push(tgt);
            adjacency.get(tgt).push(src);
        });

        const rootId = "1";
        const queue = [{ id: rootId, depth: 0 }];
        const visited = new Set([rootId]);
        maxGraphDepth = 0;

        if (nodesMap.has(rootId)) {
            nodesMap.get(rootId).depth = 0;
            
            while (queue.length > 0) {
                const { id, depth } = queue.shift();
                maxGraphDepth = Math.max(maxGraphDepth, depth);
                
                const neighbors = adjacency.get(id) || [];
                for (const neighborId of neighbors) {
                    if (!visited.has(neighborId) && nodesMap.has(neighborId)) {
                        visited.add(neighborId);
                        nodesMap.get(neighborId).depth = depth + 1;
                        queue.push({ id: neighborId, depth: depth + 1 });
                    }
                }
            }
        }

        // Handle disconnected nodes
        for (const node of nodesMap.values()) {
            if (node.depth === -1) node.depth = maxGraphDepth + 1;
        }

        fullNodes = Array.from(nodesMap.values());
        fullLinks = data.links.map(d => ({ 
            source: d.source.id || d.source, 
            target: d.target.id || d.target 
        }));

        // --- 2. Setup Input ---
        const input = document.getElementById('depthInput');
        input.max = maxGraphDepth;
        input.value = maxGraphDepth;

        // --- 3. Initial Draw ---
        filterAndDraw();
    }

    function filterAndDraw() {
        const input = document.getElementById('depthInput');
        let val = parseInt(input.value);
        if (isNaN(val)) val = maxGraphDepth;
        
        const selectedDepth = val;

        // Filter nodes
        const filteredNodes = fullNodes.filter(n => n.depth <= selectedDepth);
        const nodeIds = new Set(filteredNodes.map(n => n.id));

        // Filter links (both ends must be in filtered nodes)
        const filteredLinks = fullLinks.filter(l => 
            nodeIds.has(l.source) && nodeIds.has(l.target)
        ).map(l => ({ ...l })); // Clone to avoid D3 mutating original objects

        // Clone nodes for D3 to avoid mutating original fullNodes state (x, y, vx, vy)
        const d3Nodes = filteredNodes.map(n => ({ ...n })); 

        drawGraph(d3Nodes, filteredLinks, selectedDepth);
    }

    function drawGraph(nodes, links, currentMaxDepth) {
        const container = document.getElementById('graph-container');
        container.innerHTML = ''; // Clear previous

        const width = container.clientWidth;
        const height = container.clientHeight;

        // --- Setup D3 ---
        
        // Color Scale: Rainbow (Red -> Orange -> Yellow -> Green -> Blue)
        // Use the global maxGraphDepth for consistent coloring across filters, 
        // OR use currentMaxDepth to spread rainbow across visible?
        // Usually consistent coloring is better so "Red" is always root and "Blue" is always deep.
        const customColor = d3.scaleLinear()
            .domain([0, maxGraphDepth * 0.25, maxGraphDepth * 0.5, maxGraphDepth * 0.75, maxGraphDepth])
            .range(["#ef4444", "#f97316", "#eab308", "#22c55e", "#3b82f6"]) 
            .interpolate(d3.interpolateHcl);

        zoom = d3.zoom()
            .scaleExtent([0.1, 4])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });

        svg = d3.select('#graph-container').append('svg')
            .attr("width", "100%")
            .attr("height", "100%")
            .call(zoom)
            .on("dblclick.zoom", null);

        // Define arrow marker
        svg.append("defs").selectAll("marker")
            .data(["end"])
            .join("marker")
            .attr("id", "arrow")
            .attr("viewBox", "0 -5 10 10")
            .attr("refX", 22)
            .attr("refY", 0)
            .attr("markerWidth", 6)
            .attr("markerHeight", 6)
            .attr("orient", "auto")
            .append("path")
            .attr("fill", "#cbd5e1")
            .attr("d", "M0,-5L10,0L0,5");

        g = svg.append("g");

        // --- Force Simulation ---
        const levelHeight = 100;

        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(50).strength(0.5))
            .force("charge", d3.forceManyBody().strength(-400))
            .force("collide", d3.forceCollide().radius(25))
            .force("y", d3.forceY(d => d.depth * levelHeight).strength(1))
            .force("x", d3.forceX(0).strength(0.05));

        // --- Draw Elements ---
        const link = g.append("g")
            .attr("class", "link")
            .selectAll("line")
            .data(links)
            .join("line")
            .attr("marker-end", "url(#arrow)");

        const node = g.append("g")
            .attr("class", "node")
            .selectAll("g")
            .data(nodes)
            .join("g")
            .call(drag(simulation));

        node.append("circle")
            .attr("r", 8)
            .attr("fill", d => customColor(d.depth));

        node.append("text")
            .attr("dy", "0.31em")
            .attr("x", 14)
            .text(d => d.name);

        // --- Interactions ---
        const tooltip = document.getElementById('tooltip');
        
        node.on("mouseover", (event, d) => {
            tooltip.style.opacity = 1;
            tooltip.innerHTML = `
                <strong>${d.name}</strong>
                <div style="color: #94a3b8; font-size: 0.8em; margin-bottom: 4px;">ID: ${d.id}</div>
                <div>${d.school || 'Unknown School'}</div>
                <div style="color: #cbd5e1;">${d.year || 'Unknown Year'}</div>
                <div style="margin-top: 4px; font-size: 0.8em; color: #60a5fa;">Depth: ${d.depth}</div>
            `;
            
            const containerRect = container.getBoundingClientRect();
            const x = event.clientX - containerRect.left + 15;
            const y = event.clientY - containerRect.top + 15;
            
            tooltip.style.left = x + 'px';
            tooltip.style.top = y + 'px';
            tooltip.style.transform = 'scale(1)';
        })
        .on("mousemove", (event) => {
             const containerRect = container.getBoundingClientRect();
             tooltip.style.left = (event.clientX - containerRect.left + 15) + 'px';
             tooltip.style.top = (event.clientY - containerRect.top + 15) + 'px';
        })
        .on("mouseout", () => {
            tooltip.style.opacity = 0;
            tooltip.style.transform = 'scale(0.95)';
        });

        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            node
                .attr("transform", d => `translate(${d.x},${d.y})`);
        });
        
        // Initial Zoom
        setTimeout(() => {
            const rootNode = nodes.find(n => n.id === "1");
            if (rootNode) {
                const initialScale = 1;
                const tx = (width / 2) - (rootNode.x * initialScale);
                const ty = 100 - (rootNode.y * initialScale);
                
                svg.transition().duration(750).call(
                    zoom.transform, 
                    d3.zoomIdentity.translate(tx, ty).scale(initialScale)
                );
            } else {
                 svg.transition().duration(750).call(
                    zoom.transform, 
                    d3.zoomIdentity.translate(width/2, 50).scale(1)
                );
            }
        }, 500);
    }

    // Drag behavior
    function drag(simulation) {
        function dragstarted(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
            d3.select(this).select("circle").attr("stroke", "#fff").style("cursor", "grabbing");
        }

        function dragged(event) {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
        }

        function dragended(event) {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
            d3.select(this).select("circle").attr("stroke", null).style("cursor", "grab");
        }

        return d3.drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended);
    }

    // Zoom Controls
    window.zoomIn = function() {
        svg.transition().call(zoom.scaleBy, 1.2);
    }
    
    window.zoomOut = function() {
        svg.transition().call(zoom.scaleBy, 0.8);
    }
    
    window.zoomReset = function() {
        svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity.translate(svg.attr("width")/2, 50).scale(1));
        // Note: Ideally we recenter on root again, but simple reset is fine for now
    }

</script>

</body>
</html>
