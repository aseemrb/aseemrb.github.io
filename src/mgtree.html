<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Genealogy Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f3f4f6;
            color: #1f2937;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 10px;
        }

        h1 { margin: 0; font-size: 1.5rem; color: #111827; }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background-color: #2563eb;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            border: none;
            transition: background 0.2s;
        }

        .btn:hover { background-color: #1d4ed8; }
        .btn-outline { background-color: transparent; border: 1px solid #2563eb; color: #2563eb; }
        .btn-outline:hover { background-color: #eff6ff; }

        #tree-container {
            flex-grow: 1;
            overflow: auto;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            background: #fff;
            position: relative;
        }

        /* D3 Tree Styles */
        .node circle {
            fill: #fff;
            stroke: #2563eb;
            stroke-width: 2px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .node circle:hover {
            fill: #eff6ff;
            stroke-width: 3px;
        }

        .node text {
            font: 12px sans-serif;
            fill: #374151;
        }

        .node .year-text {
            font-size: 10px;
            fill: #6b7280;
        }

        .link {
            fill: none;
            stroke: #cbd5e1;
            stroke-width: 1.5px;
        }

        .tooltip {
            position: absolute;
            text-align: center;
            padding: 8px;
            font: 12px sans-serif;
            background: #1f2937;
            color: #fff;
            border-radius: 4px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #6b7280;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Math Genealogy Viewer</h1>
        <div class="controls">
            <label class="btn">
                Upload JSON
                <input type="file" id="fileInput" accept=".json">
            </label>
            <button class="btn btn-outline" onclick="loadExample()">Load Demo</button>
        </div>
    </header>

    <div id="tree-container">
        <div class="empty-state">
            <p>Upload a JSON file generated by the Python scraper to view the tree.</p>
        </div>
    </div>
    
    <div id="tooltip" class="tooltip"></div>
</div>

<script>
    // Example data (Terence Tao's lineage snippet)
    const demoData = {
        "name": "Terence Tao", "year": "1996", "school": "Princeton University",
        "children": [
            {
                "name": "Elias M. Stein", "year": "1955", "school": "University of Chicago",
                "children": [
                    {
                        "name": "Antoni Zygmund", "year": "1923", "school": "University of Warsaw",
                        "children": [
                            {
                                "name": "Aleksander Rajchman", "year": "1918", "school": "University of Warsaw",
                                "children": [
                                    { "name": "Stefan Mazurkiewicz", "year": "1913", "school": "Lviv University" },
                                    { "name": "Hugo Steinhaus", "year": "1911", "school": "University of Göttingen" }
                                ]
                            }
                        ]
                    }
                ]
            }
        ]
    };

    const width = 2000; // Large width for scrolling
    const height = 1000; 
    let root;

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                drawTree(data);
            } catch (err) {
                alert("Error parsing JSON file. Make sure it was generated correctly.");
                console.error(err);
            }
        };
        reader.readAsText(file);
    });

    function loadExample() {
        drawTree(demoData);
    }

    function drawTree(data) {
        const container = document.getElementById('tree-container');
        container.innerHTML = ''; // Clear previous

        // Setup D3
        // We calculate tree size based on number of nodes to ensure it fits
        const rootHierarchy = d3.hierarchy(data);
        const totalNodes = rootHierarchy.descendants().length;
        
        // Dynamic sizing
        const dx = 40; // Vertical spacing
        const dy = 180; // Horizontal spacing
        
        const treeLayout = d3.tree().nodeSize([dx, dy]);
        
        root = treeLayout(rootHierarchy);

        // Find bounds
        let x0 = Infinity;
        let x1 = -Infinity;
        root.each(d => {
            if (d.x > x1) x1 = d.x;
            if (d.x < x0) x0 = d.x;
        });

        const svgHeight = x1 - x0 + dx * 2;
        const svgWidth = (root.height + 1) * dy + 200;

        const svg = d3.select('#tree-container').append('svg')
            .attr("width", svgWidth)
            .attr("height", svgHeight)
            .attr("viewBox", [-100, x0 - dx, svgWidth, svgHeight])
            .style("font", "12px sans-serif")
            .style("user-select", "none");

        const g = svg.append("g")
            .attr("transform", `translate(50,0)`);

        const link = g.append("g")
            .attr("fill", "none")
            .attr("stroke", "#555")
            .attr("stroke-opacity", 0.4)
            .attr("stroke-width", 1.5)
            .selectAll("path")
            .data(root.links())
            .join("path")
            .attr("d", d3.linkHorizontal()
                .x(d => d.y)
                .y(d => d.x));

        const node = g.append("g")
            .attr("stroke-linejoin", "round")
            .attr("stroke-width", 3)
            .selectAll("g")
            .data(root.descendants())
            .join("g")
            .attr("transform", d => `translate(${d.y},${d.x})`);

        // Node circles
        node.append("circle")
            .attr("fill", d => d.children ? "#2563eb" : "#93c5fd")
            .attr("r", 6)
            .style("cursor", "pointer")
            .on("mouseover", showTooltip)
            .on("mouseout", hideTooltip);

        // Name text
        node.append("text")
            .attr("dy", "-0.5em")
            .attr("x", d => d.children ? -8 : 8)
            .attr("text-anchor", d => d.children ? "end" : "start")
            .text(d => d.data.name)
            .style("font-weight", "bold")
            .clone(true).lower()
            .attr("stroke", "white");

        // Info text (School, Year)
        node.append("text")
            .attr("dy", "0.8em")
            .attr("x", d => d.children ? -8 : 8)
            .attr("text-anchor", d => d.children ? "end" : "start")
            .text(d => {
                const year = d.data.year || "";
                const school = d.data.school || "";
                if (year && school) return `${school}, ${year}`;
                return school || year;
            })
            .style("font-size", "10px")
            .style("fill", "#666");
    }

    const tooltip = document.getElementById('tooltip');

    function showTooltip(event, d) {
        tooltip.style.opacity = 1;
        tooltip.innerHTML = `<strong>${d.data.name}</strong><br>${d.data.school || 'Unknown School'}<br>${d.data.year || 'Unknown Year'}<br>ID: ${d.data.id}`;
        tooltip.style.left = (event.pageX + 10) + 'px';
        tooltip.style.top = (event.pageY + 10) + 'px';
    }

    function hideTooltip() {
        tooltip.style.opacity = 0;
    }

</script>

</body>
</html>
